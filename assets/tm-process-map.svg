<rect x="42" y="238" width="151" height="28" rx="14" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.3"/><text x="54" y="257" font-size="12.5"><tspan font-weight="700" fill="#2b6cb0">DTR</tspan><tspan fill="#2d3748" dx="6">из поставки</tspan></text>
<rect x="42" y="274" width="151" height="28" rx="14" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.3"/><text x="54" y="293" font-size="12.5"><tspan font-weight="700" fill="#2b6cb0">FWO</tspan><tspan fill="#2d3748" dx="6">заказ клиента</tspan></text>
