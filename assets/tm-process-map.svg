<text x="76" y="124" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Спрос</text>
<text x="42" y="172" font-size="12" fill="#4a5568" font-weight="normal" text-anchor="start">Заказ SD, поставка</text>
