<text x="1017" y="188" font-size="12" fill="#4a5568" font-weight="normal" text-anchor="start">FWA для продажи</text>
<rect x="1017" y="202" width="151" height="28" rx="14" fill="#ffffff" stroke="#c53030" stroke-width="1.3"/><text x="1092.5" y="221" font-size="12.5" fill="#2d3748" font-weight="normal" text-anchor="middle">Расчёт стоимости</text>
<rect x="1017" y="238" width="151" height="28" rx="14" fill="#ffffff" stroke="#c53030" stroke-width="1.3"/><text x="1029" y="257" font-size="12.5"><tspan font-weight="700" fill="#c53030">FSD</tspan><tspan fill="#2d3748" dx="6">→ MM</tspan></text>
<rect x="1017" y="274" width="151" height="28" rx="14" fill="#ffffff" stroke="#c53030" stroke-width="1.3"/><text x="1029" y="293" font-size="12.5"><tspan font-weight="700" fill="#c53030">FWSD</tspan><tspan fill="#2d3748" dx="6">→ SD</tspan></text>
