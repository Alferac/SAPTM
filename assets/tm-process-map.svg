<rect x="822" y="202" width="151" height="28" rx="14" fill="#ffffff" stroke="#6b46c1" stroke-width="1.3"/><text x="897.5" y="221" font-size="12.5" fill="#2d3748" font-weight="normal" text-anchor="middle">События исполнения</text>
<rect x="822" y="238" width="151" height="28" rx="14" fill="#ffffff" stroke="#6b46c1" stroke-width="1.3"/><text x="897.5" y="257" font-size="12.5" fill="#2d3748" font-weight="normal" text-anchor="middle">Печать и вывод (PPF)</text>
<rect x="822" y="274" width="151" height="28" rx="14" fill="#ffffff" stroke="#6b46c1" stroke-width="1.3"/><text x="897.5" y="293" font-size="12.5" fill="#2d3748" font-weight="normal" text-anchor="middle">Отслеживание</text>
