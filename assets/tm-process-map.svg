<rect x="30" y="410" width="1140" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
<text x="46" y="435" font-size="13.5"><tspan font-weight="700" fill="#1a202c">Мастер-данные</tspan><tspan fill="#2d3748" dx="12">Location · Transportation Zone · Transportation Lane · Means of Transport · Resource · Business Partner · соглашения FA и FWA</tspan></text>
<rect x="30" y="460" width="1140" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
<text x="46" y="485" font-size="13.5"><tspan font-weight="700" fill="#1a202c">Настройка (SPRO)</tspan><tspan fill="#2d3748" dx="12">тип каждого документа задаёт его поведение: тип FU, тип FO, тип FWO, профили планирования, условия</tspan></text>
