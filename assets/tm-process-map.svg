<rect x="432" y="238" width="151" height="28" rx="14" fill="#ffffff" stroke="#c05621" stroke-width="1.3"/><text x="444" y="257" font-size="12.5"><tspan font-weight="700" fill="#c05621">FB</tspan><tspan fill="#2d3748" dx="6">бронирование</tspan></text>
<rect x="432" y="274" width="151" height="28" rx="14" fill="#ffffff" stroke="#c05621" stroke-width="1.3"/><text x="444" y="293" font-size="12.5"><tspan font-weight="700" fill="#c05621">TU</tspan><tspan fill="#2d3748" dx="6">трейлер, вагон</tspan></text>
