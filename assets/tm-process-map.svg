<rect x="627" y="202" width="151" height="28" rx="14" fill="#ffffff" stroke="#b7791f" stroke-width="1.3"/><text x="702.5" y="221" font-size="12.5" fill="#2d3748" font-weight="normal" text-anchor="middle">Carrier selection</text>
<rect x="627" y="238" width="151" height="28" rx="14" fill="#ffffff" stroke="#b7791f" stroke-width="1.3"/><text x="702.5" y="257" font-size="12.5" fill="#2d3748" font-weight="normal" text-anchor="middle">Tendering</text>
<text x="627" y="292" font-size="12" fill="#b7791f" font-weight="normal" text-anchor="start" font-style="italic">Работают с FO и FB</text>
